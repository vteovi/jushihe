name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - dev
    paths-ignore:
      - '**.md'
      - '.workbuddy/**'
  tags:
    - 'v*'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > TVBoxOSC.jks
            echo "使用 KEYSTORE_BASE64 提供的形式签名文件"
          else
            echo "::warning::未配置 KEYSTORE_BASE64，本次使用临时生成的签名（与正式包签名不同，无法覆盖安装）"
            keytool -genkeypair -v -keystore TVBoxOSC.jks -storetype JKS \
              -alias TVBoxOSC -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass TVBoxOSC -keypass TVBoxOSC \
              -dname "CN=MBox, OU=Dev, O=MBox, L=CN, ST=CN, C=CN"
          fi
          ls -l TVBoxOSC.jks

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            --stacktrace

      - name: Show outputs
        run: ls -lh app/build/outputs/apk/release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MBox-${{ github.ref_name }}-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
